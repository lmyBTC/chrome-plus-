<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日循環儀表板</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: 'Inter', sans-serif;
      margin: 0;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .status {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .button {
      width: 100%;
      padding: 8px 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>每日循環儀表板</h2>
  </div>
  
  <div class="status" id="status">
    載入中...
  </div>
  
  <button class="button" id="openDashboard">
    打開儀表板
  </button>
  
  <button class="button" id="openOptions">
    設定
  </button>
  
  <script type="module" src="/src/entries/popup.ts"></script>
</body>
</html>
