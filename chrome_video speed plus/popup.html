<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin: 0;
    }
    
    .container {
      text-align: center;
    }
    
    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    
    .speed-controls {
      margin-bottom: 20px;
    }
    
    .speed-btn {
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.3);
      color: white;
      padding: 8px 16px;
      margin: 5px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 14px;
    }
    
    .speed-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }
    
    .speed-btn.active {
      background: rgba(255,255,255,0.4);
      border-color: rgba(255,255,255,0.8);
    }
    
    .custom-speed {
      margin-top: 15px;
    }
    
    .custom-speed input {
      width: 60px;
      padding: 8px;
      border: none;
      border-radius: 10px;
      text-align: center;
      margin-right: 10px;
      background: rgba(255,255,255,0.9);
    }
    
    .custom-speed button {
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.3);
      color: white;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .custom-speed button:hover {
      background: rgba(255,255,255,0.3);
    }
    
    .status {
      margin-top: 15px;
      padding: 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      font-size: 12px;
    }
    
    .loop-controls {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }
    
    .loop-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .loop-row label {
      font-size: 14px;
    }
    
    .loop-row input {
      width: 60px;
      padding: 6px;
      border: none;
      border-radius: 6px;
      text-align: center;
      background: rgba(255,255,255,0.9);
    }
    
    .loop-btn {
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(255,255,255,0.3);
      color: white;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 12px;
      width: 48%;
    }
    
    .loop-btn:hover {
      background: rgba(255,255,255,0.3);
    }
    
    .loop-btn.active {
      background: rgba(46, 204, 113, 0.4);
      border-color: rgba(46, 204, 113, 0.8);
    }
    
    .loop-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }

    .scrum-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.2);
      text-align: left;
    }
    
    .section-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .shortcut-badge {
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: rgba(255, 255, 255, 0.9);
    }
    
    .scrum-btn {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: 2px solid rgba(255,255,255,0.3);
      color: white;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 13px;
      font-weight: 600;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    
    .scrum-btn:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      transform: translateY(-1px);
    }

    .scrum-btn:active {
      transform: translateY(0);
    }

    .scrum-config {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .scrum-input-row {
      display: flex;
      gap: 6px;
    }

    .scrum-input {
      flex: 1;
      padding: 6px 8px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.9);
      color: #1f2937;
      outline: none;
    }

    .scrum-sub-btn {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .scrum-sub-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .scrum-status-msg {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 4px;
      min-height: 16px;
      text-align: center;
    }

    .bookmark-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.2);
      text-align: left;
    }
    
    .bookmark-btn-group {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    
    .bookmark-btn {
      flex: 1;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 7px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    
    .bookmark-btn:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      transform: translateY(-1px);
    }

    .bookmark-sub-actions {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    
    .bookmark-sub-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s ease;
      text-align: center;
    }
    
    .bookmark-sub-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .bookmark-input-panel {
      display: none;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .bookmark-input-panel.active {
      display: block;
    }

    .bookmark-note-input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.95);
      color: #1f2937;
      outline: none;
      margin-bottom: 8px;
    }

    .bookmark-input-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .bookmark-list-container {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 8px 10px;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .bookmark-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .bookmark-clear-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-size: 10px;
      padding: 0;
      text-decoration: underline;
    }

    .bookmark-clear-btn:hover {
      color: #f87171;
    }

    .bookmark-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 4px 8px;
      margin-bottom: 5px;
      font-size: 11px;
      transition: background 0.2s;
    }

    .bookmark-item:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .bookmark-item-content {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      flex: 1;
    }

    .bookmark-time-badge {
      background: rgba(99, 102, 241, 0.5);
      border: 1px solid rgba(129, 140, 248, 0.6);
      color: #e0e7ff;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .bookmark-time-badge:hover {
      background: rgba(99, 102, 241, 0.8);
    }

    .bookmark-note-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f3f4f6;
    }

    .bookmark-del-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 0 4px;
    }

    .bookmark-del-btn:hover {
      color: #f87171;
    }

    .bookmark-empty-msg {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 YouTube Speed Plus</h1>
    
    <div class="speed-controls">
      <button class="speed-btn" data-speed="0.25">0.25x</button>
      <button class="speed-btn" data-speed="0.5">0.5x</button>
      <button class="speed-btn" data-speed="0.75">0.75x</button>
      <button class="speed-btn" data-speed="1">1x</button>
      <button class="speed-btn" data-speed="1.5">1.5x</button>
      <button class="speed-btn" data-speed="2">2x</button>
      <button class="speed-btn" data-speed="3">3x</button>
    </div>
    
    <div class="custom-speed">
      <input type="number" id="customSpeed" min="0.1" max="16" step="0.1" value="3" placeholder="自訂速度">
      <button id="setCustomSpeed">設定</button>
    </div>
    
    <div class="status" id="status">
      目前速度: 1x
    </div>
    
    <div class="loop-controls">
      <div class="loop-row">
        <label>循環次數 (0 為無限)</label>
        <input type="number" id="loopCount" min="0" value="0">
      </div>
      <div class="loop-row">
        <label>起點 (秒)</label>
        <input type="number" id="loopStart" min="0" step="1" placeholder="留空從頭">
      </div>
      <div class="loop-row">
        <label>終點 (秒)</label>
        <input type="number" id="loopEnd" min="0" step="1" placeholder="留空到尾">
      </div>
      <div class="loop-actions">
        <button class="loop-btn" id="btnSetStart">擷取為起點</button>
        <button class="loop-btn" id="btnSetEnd">擷取為終點</button>
      </div>
      <div class="loop-actions">
        <button class="loop-btn" id="btnStartLoop">開始循環</button>
        <button class="loop-btn" id="btnStopLoop">停止循環</button>
      </div>
    </div>

    <div class="scrum-section">
      <div class="section-title">
        <span>📥 ScrumClock 收集器</span>
        <span class="shortcut-badge">Alt + S</span>
      </div>
      
      <button class="scrum-btn" id="btnCollectScrum">
        <span>📥 收集當前字幕至 ScrumClock</span>
      </button>

      <div class="scrum-config">
        <div class="scrum-input-row">
          <input type="text" id="scrumExtIdInput" class="scrum-input" placeholder="ScrumClock Extension ID">
          <button id="btnSaveScrumId" class="scrum-sub-btn">儲存</button>
          <button id="btnTestScrumConn" class="scrum-sub-btn">測試</button>
        </div>
        <div id="scrumStatusMsg" class="scrum-status-msg"></div>
      </div>
    </div>

    <div class="bookmark-section">
      <div class="section-title">
        <span>⏱️ 法說會/影音筆記打點</span>
        <span class="shortcut-badge">Alt + B</span>
      </div>

      <div class="bookmark-btn-group">
        <button class="bookmark-btn" id="btnToggleBookmarkInput">
          <span>⏱️ 打點記錄秒數</span>
        </button>
      </div>

      <div id="bookmarkInputPanel" class="bookmark-input-panel">
        <div style="font-size: 11px; margin-bottom: 6px; color: #cbd5e1;">
          當前時間戳：<span id="popupCurrentTimeTag" style="font-weight: bold; color: #a5b4fc;">00:00</span>
        </div>
        <input type="text" id="popupBookmarkNote" class="bookmark-note-input" placeholder="輸入此時間戳重點 (Enter 儲存)">
        <div class="bookmark-input-actions">
          <button id="btnSavePopupBookmark" class="scrum-sub-btn">儲存</button>
          <button id="btnCancelPopupBookmark" class="scrum-sub-btn">取消</button>
        </div>
      </div>

      <div class="bookmark-sub-actions">
        <button class="bookmark-sub-btn" id="btnExportMarkdown">📋 複製 MD</button>
        <button class="bookmark-sub-btn" id="btnDownloadMarkdown">💾 下載 .md</button>
      </div>

      <div class="bookmark-list-container">
        <div class="bookmark-list-header">
          <span>本片已記錄重點 (<span id="bookmarkCount">0</span>)</span>
          <button id="btnClearBookmarks" class="bookmark-clear-btn">清空本片</button>
        </div>
        <div id="bookmarkList">
          <div class="bookmark-empty-msg">尚無記錄，點擊上方按鈕或按 Alt + B</div>
        </div>
      </div>
      <div id="bookmarkStatusMsg" class="scrum-status-msg"></div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
